# kuubik is flathub-only (fedora-flathub-remote is removed in 30-debloat), so on first boot
# add unfiltered flathub instead of the fedora oci remote. the unit still creates /var/lib/flatpak/repo
[Service]
ExecStart=
ExecStart=/usr/bin/flatpak remote-add --system --if-not-exists flathub /etc/flatpak/remotes.d/flathub.flatpakrepo
