---

name: Build, test, push container image
on:

  pull_request:
    branches:
      - main
    paths: &paths
      - ".github/workflows/build.yml"
      - "build_scripts/**"
      - "system_files/**"
      - "Containerfile"
      - "Justfile"
      - "disk_config/**"
      - "tests/**"

  push:
    branches:
      - main
    paths: *paths

  schedule:
    # tuesday 15:00 UTC
    - cron: '0 15 * * 2'

  workflow_dispatch:

env:
  IMAGE_DESC: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  FEDORA_VERSION: "44"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:

  check_formatting:
    name: Check BASH
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: run shellcheck checker
        run: |
          find . -iname "*.sh" -type f -exec shellcheck {} +
          shellcheck system_files/base/usr/bin/kctl system_files/base/usr/libexec/kctl-update-check

  prepare:
    name: Compute build metadata
    needs: check_formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      date: ${{ steps.meta.outputs.date }}
      date_tag: ${{ steps.meta.outputs.date_tag }}
      version_tag: ${{ steps.meta.outputs.version_tag }}

    steps:
      - name: Compute date and version tags
        id: meta
        run: |
          date_tag="$(date -u +%Y%m%d).${{ github.run_number }}"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "date_tag=${date_tag}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${FEDORA_VERSION}.${date_tag}" >> "$GITHUB_OUTPUT"

  build_image:
    name: Build image (${{ matrix.flavor }})
    needs: prepare

    strategy:
      fail-fast: true
      matrix: &flavors
        include:
          - flavor: kuubik
            image: kuubik
            tag: latest
          - flavor: nvidia
            image: kuubik-nvidia
            tag: nvidia

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build production image
        run: |
          sudo buildah build \
            --target ${{ matrix.image }} \
            --file Containerfile \
            --build-arg FEDORA_VERSION=${{ env.FEDORA_VERSION }} \
            --build-arg IMAGE_VERSION=${{ needs.prepare.outputs.version_tag }} \
            --tag raw-img .

      - name: Push scratch image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo buildah login --username "${{ github.actor }}" --password-stdin ghcr.io
          sudo buildah push raw-img "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci-${{ github.run_id }}"

  test_image:
    name: Test image (${{ matrix.flavor }})
    needs: build_image

    strategy:
      fail-fast: true
      matrix: *flavors

    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y podman systemd-container

          just_version="1.52.0"
          just_archive="just-${just_version}-x86_64-unknown-linux-musl.tar.gz"
          just_sha256="e0a712614574d45625332529c864754e26782422b7c7db931466180a618f092d"

          curl --fail --location --show-error --silent --output "${just_archive}" \
            "https://github.com/casey/just/releases/download/${just_version}/${just_archive}"
          echo "${just_sha256}  ${just_archive}" | sha256sum --check
          tar -xzf "${just_archive}" just
          sudo install -m 0755 just /usr/local/bin/just

      - name: Pull scratch image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login --username "${{ github.actor }}" --password-stdin ghcr.io
          sudo podman pull "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci-${{ github.run_id }}"

      - name: Run integration tests
        run: just test "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci-${{ github.run_id }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.flavor }}
          path: |
            test-results/
            vm.log
          if-no-files-found: warn
          retention-days: 14

  publish_image:
    name: Rechunk and publish (${{ matrix.flavor }})
    needs: [prepare, build_image, test_image]

    strategy:
      fail-fast: true
      matrix: *flavors

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ needs.prepare.outputs.date_tag }}
            type=raw,value=latest
            type=raw,value=${{ env.FEDORA_VERSION }}
            type=raw,value=${{ needs.prepare.outputs.version_tag }}
            type=raw,value=${{ matrix.tag }},enable=${{ matrix.tag != 'latest' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/readme.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_tag }}
            containers.bootc=1
          sep-tags: ' '
          sep-annotations: ' '

      - name: Pull scratch image
        run: |
          scratch_ref="${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci-${{ github.run_id }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo buildah login --username "${{ github.actor }}" --password-stdin ghcr.io
          sudo buildah pull "${scratch_ref}"
          sudo buildah tag "${scratch_ref}" raw-img

      - name: Run Rechunker
        id: rechunk
        uses: ublue-os/legacy-rechunk@v1.0.0
        with:
          rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
          ref: 'raw-img'
          prev-ref: '${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ matrix.tag }}'
          skip_compression: false
          version: '${{ steps.metadata.outputs.tags }}'
          labels: '${{ steps.metadata.outputs.labels }}'

      - name: Load in podman and tag
        run: |
          sudo chown -R "$(id -u):$(id -g)" "/run/user/$(id -u)" 2>/dev/null || true
          IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
          sudo rm -rf ${{ steps.rechunk.outputs.output }}
          for tag in ${{ steps.metadata.outputs.tags }}; do
            podman tag $IMAGE "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:$tag"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request'
        run: |
          for tag in ${{ steps.metadata.outputs.tags }}; do
            for attempt in 1 2 3 4 5; do
              podman push "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:$tag" && break
              [ "$attempt" -lt 5 ] || exit 1
              echo "push of $tag failed, retrying in 10s"
              sleep 10
            done
          done

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: "v2.6.1"

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:$tag"
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  cleanup_scratch_images:
    name: Clean up scratch CI image (${{ matrix.flavor }})
    if: always()
    needs: [build_image, test_image, publish_image]

    strategy:
      matrix: *flavors

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      packages: write

    steps:
      - name: Delete scratch CI image
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ matrix.image }}
          tags: ci-${{ github.run_id }}
