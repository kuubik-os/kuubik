---

name: Build, test, push container image
on:

  pull_request:
    branches:
      - main
    paths: &paths
      - ".github/workflows/build.yml"
      - "build_scripts/**"
      - "system_files/**"
      - "Containerfile"
      - "Justfile"
      - "disk_config/**"
      - "tests/**"

  push:
    branches:
      - main
    paths: *paths

  schedule:
    # tuesday 15:00 UTC
    - cron: '0 15 * * 2'

  workflow_dispatch:

env:
  IMAGE_DESC: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  FEDORA_VERSION: "44"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:

  check_formatting:
    name: Check BASH
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: run shellcheck checker
        run: |
          find . -iname "*.sh" -type f -exec shellcheck {} +
          shellcheck system_files/shared/usr/bin/kctl system_files/shared/usr/libexec/kctl-update-check system_files/shared/usr/libexec/kuubik-factory-image

  prepare:
    name: Compute build metadata
    needs: check_formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      actions: read

    outputs:
      date: ${{ steps.meta.outputs.date }}
      date_tag: ${{ steps.meta.outputs.date_tag }}

    steps:
      - name: Compute date and version tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          day="${now%%T*}"

          # build number for the day: earlier non-PR runs of this workflow today + 1. failed and cancelled
          # runs count too, they may have pushed some flavors, so a number is never reused
          seq="$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=100&created=${day}" \
            --jq '[.workflow_runs[] | select(.event != "pull_request" and .id < ${{ github.run_id }})] | length + 1')"

          echo "date=${now}" >> "$GITHUB_OUTPUT"
          echo "date_tag=${day//-/}.${seq}" >> "$GITHUB_OUTPUT"

  build_image:
    name: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'Build, test, publish' || 'Build and test' }} (${{ matrix.flavor }})
    needs: prepare

    strategy:
      fail-fast: true
      matrix:
        include:
          - flavor: kuubik
            image: kuubik
            tag: latest
          - flavor: nvidia
            image: kuubik-nvidia
            tag: nvidia

    runs-on: ubuntu-24.04
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      # only main builds are pushed, PR runs build and test locally
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      # build, test vm disk and rechunk all share one runner disk. runners start with ~88G free,
      # enough for all of it; the slow cleanup (~4 min) only runs if a runner comes with less
      - name: Check disk space
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 60 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
            df -h /
          fi

      # with redirect_dir on, containers/storage falls back to naive diff and every image commit
      # walks the whole tree (~3 min each). must run before the first podman/buildah call
      - name: Enable overlay native diff
        run: echo N | sudo tee /sys/module/overlay/parameters/redirect_dir

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install just
        run: |
          just_version="1.52.0"
          just_archive="just-${just_version}-x86_64-unknown-linux-musl.tar.gz"
          just_sha256="e0a712614574d45625332529c864754e26782422b7c7db931466180a618f092d"

          curl --fail --location --show-error --silent --output "${just_archive}" \
            "https://github.com/casey/just/releases/download/${just_version}/${just_archive}"
          echo "${just_sha256}  ${just_archive}" | sha256sum --check
          tar -xzf "${just_archive}" just
          sudo install -m 0755 just /usr/local/bin/just
          rm "${just_archive}" just

      # registry sometimes drop connections during pull, so do it in advance with retries
      - name: Pull base images
        run: |
          for image in \
            ghcr.io/ublue-os/brew:latest \
            quay.io/fedora-ostree-desktops/kinoite:${{ env.FEDORA_VERSION }}; do
            for attempt in 1 2 3 4 5; do
              sudo buildah pull "${image}" && break
              [ "$attempt" -lt 5 ] || exit 1
              echo "pull of ${image} failed, retrying in 30s"
              sleep 30
            done
          done

      - name: Build production image
        env:
          SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
        run: |
          # empty for fork PRs, the build then skips secure boot signing
          (umask 077 && printf '%s' "${SECUREBOOT_KEY}" > secureboot.key)
          if [[ "${PUBLISH}" == "true" && ! -s secureboot.key ]]; then
            echo "SECUREBOOT_KEY secret is required to publish" >&2
            exit 1
          fi
          sudo buildah build \
            --secret id=secureboot_key,src=secureboot.key \
            --pull=missing \
            --target ${{ matrix.image }} \
            --file Containerfile \
            --build-arg FEDORA_VERSION=${{ env.FEDORA_VERSION }} \
            --build-arg IMAGE_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --tag raw-img .
          rm -f secureboot.key

      - name: Run integration tests
        run: just test localhost/raw-img:latest

      - name: Disk usage after tests
        if: always()
        run: df -h /

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.flavor }}
          path: |
            test-results/
            vm.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove test leftovers
        if: env.PUBLISH == 'true'
        run: |
          sudo rm -rf output
          sudo podman rmi -f localhost/kuubik-test:latest localhost/kuubik-test-runner:latest

      # rechunk deletes raw-img, so collect release info first
      - name: Collect release info
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p release
          sudo podman run --rm --entrypoint /bin/sh localhost/raw-img:latest -c \
            'rpm -qa --qf "%{NAME} %{VERSION}-%{RELEASE}\n" | grep -v "^gpg-pubkey " | LC_ALL=C sort -u' \
            > "release/packages-${{ matrix.image }}.txt"
          {
            echo "base: Fedora ${{ env.FEDORA_VERSION }}"
            echo "kernel: $(sudo podman run --rm --entrypoint /bin/ls localhost/raw-img:latest /usr/lib/modules)"
            echo "plasma: $(sudo podman run --rm --entrypoint /usr/bin/rpm localhost/raw-img:latest -q --qf '%{VERSION}' plasma-workspace)"
          } > "release/meta-${{ matrix.image }}.txt"

      - name: Upload release info
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.flavor }}
          path: release/
          if-no-files-found: error
          retention-days: 1

      - name: Image Metadata
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ needs.prepare.outputs.date_tag }}
            type=raw,value=latest
            type=raw,value=${{ env.FEDORA_VERSION }}
            type=raw,value=${{ matrix.tag }},enable=${{ matrix.tag != 'latest' }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/readme.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.date_tag }}
            containers.bootc=1
          sep-tags: ' '
          sep-annotations: ' '

      - name: Run Rechunker
        if: env.PUBLISH == 'true'
        id: rechunk
        uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710 # v1.0.0
        with:
          rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
          ref: 'raw-img'
          prev-ref: '${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ matrix.tag }}'
          skip_compression: false
          version: '${{ steps.metadata.outputs.tags }}'
          labels: '${{ steps.metadata.outputs.labels }}'

      - name: Load in podman and tag
        if: env.PUBLISH == 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" "/run/user/$(id -u)" 2>/dev/null || true
          IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
          sudo rm -rf ${{ steps.rechunk.outputs.location }}
          for tag in ${{ steps.metadata.outputs.tags }}; do
            podman tag $IMAGE "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:$tag"
          done

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # only the date tag goes up before signing, so a job stopped midway never leaves an unsigned latest.
      # the signature is per digest and covers every tag pushed after it
      - name: Push date tag to GHCR
        if: env.PUBLISH == 'true'
        run: &push |
          for tag in ${TAGS}; do
            for attempt in 1 2 3 4 5; do
              podman push --compression-format=zstd --compression-level=3 "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:$tag" && break
              [ "$attempt" -lt 5 ] || exit 1
              echo "push of $tag failed, retrying in 10s"
              sleep 10
            done
          done
        env:
          TAGS: ${{ needs.prepare.outputs.date_tag }}

      - name: Install Cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.1"

      - name: Sign container image
        if: env.PUBLISH == 'true'
        run: cosign sign -y --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ needs.prepare.outputs.date_tag }}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      - name: Push remaining tags to GHCR
        if: env.PUBLISH == 'true'
        run: *push
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}

  release:
    name: Create GitHub release
    needs: [prepare, build_image]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.date_tag }}

    steps:
      - name: Download release info
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: new

      # package lists of the previous release are the base for the changelog
      - name: Download previous package lists
        run: |
          gh release download --repo "${{ github.repository }}" --pattern 'packages-*.txt' --dir prev \
            || echo "no previous release found"

      - name: Write release notes
        run: |
          set -euo pipefail
          export LC_ALL=C
          max_lines=300
          for meta in new/meta-*.txt; do
            image="$(basename "${meta}" .txt)"
            image="${image#meta-}"
            new="new/packages-${image}.txt"
            prev="prev/packages-${image}.txt"

            echo "## ${image}"
            echo
            echo "- image: \`${{ env.IMAGE_REGISTRY }}/${image}:${TAG}\`"
            sed 's/^/- /' "${meta}"
            echo

            if [[ ! -f "${prev}" ]]; then
              echo "no previous release to compare against"
              echo
              continue
            fi

            changes="$({
              join "${prev}" "${new}" | awk '$2 != $3 { print "~ " $1 " " $2 " -> " $3 }'
              join -v2 "${prev}" "${new}" | sed 's/^/+ /'
              join -v1 "${prev}" "${new}" | sed 's/^/- /'
            } | sort -k2,2)"

            if [[ -z "${changes}" ]]; then
              echo "no package changes"
              echo
              continue
            fi

            echo "<details><summary>package changes ($(wc -l <<<"${changes}"))</summary>"
            echo
            echo '```diff'
            head -n "${max_lines}" <<<"${changes}"
            echo '```'
            if (( $(wc -l <<<"${changes}") > max_lines )); then
              echo "truncated, compare the attached packages-${image}.txt files for the full list"
            fi
            echo
            echo "</details>"
            echo
          done | tee notes.md

      - name: Create release
        run: |
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "kuubik ${TAG}" \
            --notes-file notes.md \
            new/packages-*.txt
