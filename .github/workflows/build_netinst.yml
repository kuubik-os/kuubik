---

name: Build network install ISO
on:

  pull_request:
    branches:
      - main
    paths: &paths
      - ".github/workflows/build_netinst.yml"
      - "installer/**"
      - "fedora-version"

  push:
    branches:
      - main
    paths: *paths

  schedule:
    - cron: '0 6 1 * *'

  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:

  build_netinst:
    name: Build netinstall ISO

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Read Fedora version
        run: echo "FEDORA_VERSION=$(<fedora-version)" >>"$GITHUB_ENV"

      # stock fedora iso keeps fedora's signed shim, grub and kernel, so it boots with secure boot on
      - name: Download fedora netinstall ISO
        run: |
          set -euo pipefail
          base="https://dl.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_VERSION}/Everything/x86_64/iso"
          index="$(curl -fsSL "${base}/")"
          iso="$(grep -o 'Fedora-Everything-netinst-x86_64-[0-9.-]*\.iso' <<<"${index}" | head -n1)"
          checksum="$(grep -o 'Fedora-Everything-[0-9.-]*-x86_64-CHECKSUM' <<<"${index}" | head -n1)"

          curl -fsSL -o CHECKSUM "${base}/${checksum}"
          curl -fsSL -o fedora.gpg https://fedoraproject.org/fedora.gpg
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import fedora.gpg
          gpg --batch --verify CHECKSUM

          curl -fL --retry 5 -o "${iso}" "${base}/${iso}"
          grep "^SHA256 (${iso})" CHECKSUM | sed -E 's/^SHA256 \((.*)\) = (.*)$/\2  \1/' | sha256sum --check
          mv "${iso}" netinst.iso

      - name: Write kickstart
        run: |
          sed "s|@REGISTRY@|${IMAGE_REGISTRY}|g" installer/netinstall.ks >kuubik.ks
          cat installer/system_files/usr/share/anaconda/post-scripts/*.ks >>kuubik.ks
          cat kuubik.ks

      - name: Build ISO
        run: |
          mkdir -p upload
          # mkksiso rebuilds efiboot.img through a loop device. the flavor menu goes into the iso first,
          # mkksiso then adds inst.ks to every entry and rebuilds efiboot.img from the edited EFI/BOOT/grub.cfg
          sudo podman run --rm --privileged \
            --volume "${PWD}:/work:Z" \
            --workdir /work \
            "registry.fedoraproject.org/fedora:${FEDORA_VERSION}" \
            bash -euo pipefail -c '
              dnf -y install lorax pykickstart xorriso mtools isomd5sum
              ksvalidator kuubik.ks
              mkdir -p grub
              xorriso -osirrox on -indev netinst.iso \
                -extract /EFI/BOOT/grub.cfg grub/efi.cfg \
                -extract /boot/grub2/grub.cfg grub/bios.cfg
              chmod u+w grub/*.cfg
              python3 installer/netinstall_menu.py grub/efi.cfg grub/bios.cfg
              cat grub/efi.cfg
              xorriso -indev netinst.iso -outdev menu.iso -boot_image any replay \
                -update grub/efi.cfg /EFI/BOOT/grub.cfg \
                -update grub/bios.cfg /boot/grub2/grub.cfg
              mkksiso --ks kuubik.ks menu.iso upload/kuubik-netinstall-amd64.iso
            '
          sudo chown -R "$(id -u):$(id -g)" upload
          iso="kuubik-netinstall-amd64-$(date -u +%Y%m%d).iso"
          echo "ISO=${iso}" >>"$GITHUB_ENV"
          mv upload/kuubik-netinstall-amd64.iso "upload/${iso}"
          cd upload && sha256sum "./${iso}" | tee "${iso}-CHECKSUM"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.1"

      - name: Sign ISO
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          for iso in upload/*.iso; do
            cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY "${iso}" --output-signature "${iso}.sig"
          done

      - name: Upload ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuubik-netinstall-amd64
          path: upload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true

      # fixed "netinstall" release so the latest iso has a stable download url; kept off "latest" so
      # build.yml still diffs packages against the last image release.
      # the website and readme link kuubik-netinstall-amd64.iso{,-CHECKSUM,.sig}, so the dated iso is
      # also published under that name; older dated isos are removed once the new one is up
      - name: Publish ISO to netinstall release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          stable=kuubik-netinstall-amd64.iso
          notes="latest netinstall ISO (${ISO}), rebuilt every month. pick the flavor in the boot menu."
          ln "upload/${ISO}" "upload/${stable}"
          cp "upload/${ISO}.sig" "upload/${stable}.sig"
          (cd upload && sha256sum "./${stable}" >"${stable}-CHECKSUM")
          gh release view netinstall --repo "${REPO}" >/dev/null 2>&1 \
            || gh release create netinstall --repo "${REPO}" --target "${{ github.sha }}" \
              --latest=false --title "kuubik netinstall ISO" --notes "${notes}"
          gh release upload netinstall --repo "${REPO}" --clobber upload/*
          gh release edit netinstall --repo "${REPO}" --notes "${notes}"
          old=$(gh release view netinstall --repo "${REPO}" --json assets -q '.assets[].name' \
            | grep -E '^kuubik-netinstall-amd64-[0-9]{8}\.iso' | grep -vF "${ISO}" || true)
          for asset in ${old}; do
            gh release delete-asset netinstall --repo "${REPO}" "${asset}" -y
          done
